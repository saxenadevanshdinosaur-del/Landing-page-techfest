<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TECHFEST 2026</title>

        <link rel="stylesheet" href="STYLE.CSS">
</head>

<body>

    <main class="hero">
            <video class="background-video" autoplay muted loop playsinline aria-hidden="true">
                <source src="tech_background.mp4" type="video/mp4">
            </video>
            <div class="video-shade"></div>

        <!-- Moving horizontal scanner -->
        <div class="scanner"></div>

        <!-- Left Content -->
        <section class="info-box">

            <div class="small-title">
                WELCOME TO
            </div>

            <h1>
                TECHFEST
                <span>2026</span>
            </h1>

            <div class="line"></div>

            <h2>
                INNOVATE. INSPIRE. IGNITE.
            </h2>

            <p style="text-align: justify;">
                Welcome to TechFest 2026, a celebration of technology, creativity and
                the future. Enter a world where ideas become
                experiences is coming to life. Join us for a
                 journey of discovery, innovation, and inspiration 
                 at TechFest 2026.    
            </p>

        </section>


        <!-- Right Image -->
            <section class="image-box">

            <img
                src="cyborg-no-bg.png"
                alt="cyborg-bartendar"
            >

            <div class="image-overlay"></div>

            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>

        </section>

    </main>

</body>
</html>
